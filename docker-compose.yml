services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    networks:
      - app-network
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
    networks:
      - app-network
    volumes:
      - ./frontend:/app

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8002:8000"
    networks:
      - app-network
    volumes:
      - chroma-data:/chroma/chroma

networks:
  app-network:
    driver: bridge

volumes:
  chroma-data:
